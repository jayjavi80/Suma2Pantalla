<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suma2 - Juego horizontal 1 a 4 jugadores</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #eef8fd;
      --blue: #0382c6;
      --blue-dark: #0269a3;
      --green: #00a66b;
      --green-dark: #078352;
      --pink: #d81b60;
      --yellow: #ffd700;
      --ink: #233241;
      --card: #ffffff;
      --line: rgba(3, 130, 198, 0.16);
      --shadow: 0 12px 28px rgba(3, 62, 100, 0.15);
      --radius: 24px;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    button,
    .opcion,
    .player-count-btn {
      -webkit-tap-highlight-color: transparent;
    }

    /* === CABECERA SUPERIOR === */
    header {
      min-height: 0;
      background: linear-gradient(180deg, #f8fdff 0%, #eef8fd 100%);
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(220px, auto) minmax(300px, 1fr);
      align-items: center;
      gap: 18px;
      padding: clamp(12px, 1.4vh, 24px) clamp(18px, 2vw, 38px);
      border-bottom: 4px solid rgba(3, 130, 198, 0.12);
      z-index: 30;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .header-left { justify-content: flex-start; flex-wrap: wrap; }
    .header-center { justify-content: center; }
    .header-right { justify-content: flex-end; flex-wrap: wrap; }

    .game-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 180px;
      text-align: center;
    }

    .game-mark img {
      max-height: clamp(46px, 4.6vh, 78px);
      max-width: min(260px, 26vw);
      object-fit: contain;
    }

    .game-title-fallback {
      font-size: clamp(24px, 2.4vw, 44px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--blue);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(3, 130, 198, 0.25);
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      border: 4px solid var(--blue);
      border-radius: 18px;
      padding: 8px 18px;
      min-width: clamp(154px, 13vw, 230px);
      box-shadow: var(--shadow);
    }

    .timer-label {
      font-size: clamp(12px, 1.1vw, 18px);
      font-weight: 900;
      color: var(--blue);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .timer-display {
      font-size: clamp(30px, 3vw, 54px);
      line-height: 1;
      font-weight: 900;
      color: var(--pink);
      min-height: 1em;
    }

    .player-count-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: white;
      border: 3px solid rgba(3, 130, 198, 0.24);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .player-count-label {
      color: var(--blue-dark);
      font-weight: 900;
      font-size: clamp(12px, 1vw, 18px);
      white-space: nowrap;
      padding: 0 4px 0 6px;
    }

    .player-count-buttons {
      display: flex;
      gap: 6px;
    }

    .player-count-btn {
      width: clamp(36px, 3.1vw, 56px);
      height: clamp(36px, 3.1vw, 56px);
      border-radius: 15px;
      border: 3px solid var(--blue);
      background: #fff;
      color: var(--blue);
      cursor: pointer;
      font-size: clamp(16px, 1.4vw, 26px);
      font-weight: 900;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .player-count-btn:hover { transform: translateY(-1px) scale(1.03); }
    .player-count-btn.active { background: var(--blue); color: white; }
    .player-count-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .action-btn,
    .language-btn,
    .music-btn,
    #fsBtn {
      min-height: clamp(42px, 3.6vh, 64px);
      padding: 10px clamp(14px, 1.3vw, 24px);
      font-size: clamp(13px, 1vw, 18px);
      border-radius: 999px;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 900;
      white-space: nowrap;
      transition: background 0.2s, transform 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.16);
    }

    .action-btn:hover,
    .language-btn:hover,
    .music-btn:hover,
    #fsBtn:hover { transform: scale(1.04); }

    .action-btn:disabled,
    #headerRestartBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #startGameBtn { background: #4CAF50; }
    #startGameBtn:hover { background: #45a049; }
    #headerRestartBtn { background: var(--blue-dark); }
    #headerRestartBtn:hover { background: var(--blue); }
    #fsBtn { background: var(--blue); }
    #fsBtn:hover { background: var(--blue-dark); }
    .language-btn { background: var(--blue); }
    .music-btn { background: var(--pink); }
    .music-btn.playing { background: #4CAF50; }

    .language-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-flag {
      width: 22px;
      height: 16px;
      border-radius: 3px;
      object-fit: cover;
    }

    .logo img {
      height: clamp(56px, 5.2vh, 98px);
      width: auto;
      max-width: 220px;
      object-fit: contain;
    }



    /* === ESCENARIO HORIZONTAL === */
    .arena {
      height: auto;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: clamp(8px, 0.75vw, 18px);
      padding: clamp(10px, 1.1vh, 20px) clamp(14px, 1.4vw, 28px) clamp(14px, 1.4vh, 26px);
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(255,255,255,0.86), transparent 26%),
        radial-gradient(circle at 80% 84%, rgba(255,255,255,0.78), transparent 28%),
        var(--bg);
    }

    body.players-1 .zone:not(.inactive) { flex: 1 1 100%; }
    body.players-2 .zone:not(.inactive) { flex: 1 1 calc((100% - clamp(8px, 0.75vw, 18px)) / 2); }
    body.players-3 .zone:not(.inactive) { flex: 1 1 calc((100% - (clamp(8px, 0.75vw, 18px) * 2)) / 3); }
    body.players-4 .zone:not(.inactive) { flex: 1 1 calc((100% - (clamp(8px, 0.75vw, 18px) * 3)) / 4); }

    .zone {
      position: relative;
      display: flex;
      flex-direction: column;
      flex-shrink: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: white;
      border: 4px solid #ffffff;
      outline: 3px solid rgba(3, 130, 198, 0.12);
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .zone.inactive { display: none; }

    .zone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(3,130,198,0.07), transparent 26%, transparent 74%, rgba(0,166,107,0.08)),
        radial-gradient(circle at 88% 18%, rgba(255,215,0,0.16), transparent 16%);
    }

    #zone1 { --accent: #0382c6; --accent-2: #00a66b; }
    #zone2 { --accent: #d81b60; --accent-2: #0382c6; }
    #zone3 { --accent: #00a66b; --accent-2: #f3c701; }
    #zone4 { --accent: #f49b21; --accent-2: #d81b60; }

    .game-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: clamp(12px, 1.2vh, 28px) clamp(18px, 2vw, 40px);
      display: flex;
    }

    .jugador {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
      grid-template-areas:
        "score name"
        "expr expr"
        "apples apples"
        "vertical vertical"
        "opts opts"
        "feedback feedback";
      gap: clamp(8px, 0.85vh, 16px) clamp(8px, 0.75vw, 18px);
      align-items: center;
    }

    .score,
    .nombre {
      border-radius: 18px;
      padding: clamp(8px, 0.8vh, 14px) clamp(12px, 1.2vw, 22px);
      font-weight: 900;
      font-size: clamp(18px, 1.75vw, 38px);
      line-height: 1.05;
      box-shadow: 0 5px 12px rgba(0,0,0,0.12);
      white-space: nowrap;
    }

    .score {
      grid-area: score;
      justify-self: start;
      background: white;
      border: 4px solid var(--accent);
      color: var(--accent);
    }

    .nombre {
      grid-area: name;
      justify-self: end;
      background: var(--accent-2);
      color: white;
      text-align: center;
      min-width: 0;
    }

    .expr {
      grid-area: expr;
      justify-self: center;
      align-self: center;
      width: 100%;
      min-height: 1em;
      font-size: clamp(32px, 4.2vw, 86px);
      font-weight: 900;
      text-align: center;
      color: #1f2e3a;
      letter-spacing: 1px;
    }

    .apples-row {
      grid-area: apples;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.4vw, 32px);
      min-height: 0;
      width: 100%;
    }

    .pile {
      min-height: clamp(54px, 5vh, 120px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: center;
      gap: clamp(4px, 0.45vw, 11px);
      font-size: clamp(26px, 3.4vw, 72px);
      line-height: 1;
      padding: 6px;
      border-radius: 18px;
      background: rgba(238, 248, 253, 0.62);
      border: 2px dashed rgba(3, 130, 198, 0.16);
      overflow: hidden;
    }

    .plus {
      font-size: clamp(30px, 4vw, 80px);
      font-weight: 900;
      color: var(--pink);
      line-height: 1;
    }

    .vertical {
      grid-area: vertical;
      align-self: center;
      justify-self: stretch;
      text-align: center;
      font-size: clamp(28px, 3.5vw, 72px);
      line-height: 1.08;
      font-weight: 900;
      color: #1f2e3a;
      border-radius: 22px;
      padding: clamp(8px, 1vh, 20px);
      background: #fff;
      border: 4px solid rgba(3, 130, 198, 0.18);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
    }

    .vertical .line {
      display: block;
      border-top: clamp(3px, 0.35vw, 8px) solid var(--blue);
      margin: clamp(4px, 0.45vh, 9px) auto 0;
      width: clamp(70px, 9vw, 180px);
    }

    .opciones {
      grid-area: opts;
      display: grid;
      grid-template-columns: repeat(4, minmax(86px, 1fr));
      gap: clamp(8px, 1vw, 18px);
      width: 100%;
      align-self: stretch;
    }

    .opcion {
      min-height: clamp(58px, 5.6vh, 112px);
      border: 4px solid var(--blue);
      border-radius: 24px;
      padding: 8px 10px;
      font-size: clamp(28px, 4vw, 80px);
      font-weight: 900;
      background: white;
      color: var(--blue);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.14s ease, background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
      box-shadow: 0 8px 16px rgba(3, 130, 198, 0.13);
      touch-action: manipulation;
    }

    .opcion:hover,
    .opcion:focus-visible {
      background: var(--blue);
      color: white;
      transform: scale(1.035);
      outline: none;
    }

    .opcion:active { transform: scale(0.96); }
    .opcion.disabled { opacity: 0.55; cursor: not-allowed; }

    .opcion.wrong {
      background: var(--pink) !important;
      color: white !important;
      border-color: var(--pink) !important;
      animation: shake 0.3s ease;
    }

    .feedback-slot {
      grid-area: feedback;
      min-height: clamp(58px, 5vh, 100px);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      pointer-events: none;
    }

    .flag-container {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1vw, 18px);
      opacity: 0;
      transform: translateX(-14px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .flag-container.show {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .flag-correct {
      font-size: clamp(38px, 4.5vw, 86px);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.18);
      animation: waveFlag 0.5s ease;
      line-height: 1;
    }

    .flag-text {
      font-size: clamp(18px, 1.8vw, 38px);
      font-weight: 900;
      color: #4CAF50;
      background: white;
      padding: 7px 18px;
      border-radius: 999px;
      border: 4px solid #4CAF50;
      box-shadow: 0 5px 12px rgba(0,0,0,0.14);
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
    }

    .flag-wrong {
      display: none;
      font-size: clamp(42px, 4.8vw, 92px);
      color: var(--pink);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.16);
      line-height: 1;
    }

    .flag-wrong.show {
      display: block;
      animation: shakeX 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-5px); }
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-12px); }
      50% { transform: translateX(12px); }
      75% { transform: translateX(-6px); }
    }

    @keyframes waveFlag {
      0% { transform: rotate(-15deg); }
      25% { transform: rotate(10deg); }
      50% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Overlays */
    .winner-overlay,
    .start-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .winner-overlay {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
    }

    .start-overlay {
      background: rgba(3, 130, 198, 0.95);
      flex-direction: column;
      color: white;
      text-align: center;
      z-index: 3000;
    }

    .winner-overlay.show,
    .start-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .winner-card {
      width: min(760px, 88vw);
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      padding: clamp(28px, 3vh, 58px) clamp(28px, 3vw, 70px);
      border-radius: 34px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 5px solid var(--yellow);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .winner-title {
      font-size: clamp(38px, 5vw, 78px);
      font-weight: 900;
      color: var(--yellow);
      text-shadow: 3px 3px 0 #00000050;
      margin-bottom: 26px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .ranking-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 22px;
      margin: 18px 0;
      backdrop-filter: blur(5px);
    }

    .ranking-title {
      font-size: clamp(22px, 2.6vw, 40px);
      color: white;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
    }

    .ranking-list { display: grid; gap: 10px; }

    .ranking-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 22px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      font-size: clamp(20px, 2.3vw, 36px);
      color: white;
      border: 2px solid transparent;
      transition: all 0.3s;
      gap: 14px;
    }

    .ranking-item.first {
      background: linear-gradient(90deg, #ffd700, #ffa500);
      border-color: #fff;
      transform: scale(1.02);
      box-shadow: 0 0 20px #ffd700;
      color: #1e3c72;
    }

    .ranking-item.second {
      background: linear-gradient(90deg, #c0c0c0, #a0a0a0);
      border-color: #fff;
      color: #1e3c72;
    }

    .ranking-item.third {
      background: linear-gradient(90deg, #cd7f32, #b06d2e);
      border-color: #fff;
    }

    .player-info { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .medal { font-size: clamp(30px, 3vw, 48px); width: 1.25em; text-align: center; }
    .player-name { font-weight: 900; }
    .player-score {
      font-weight: 900;
      background: rgba(0, 0, 0, 0.28);
      padding: 6px 18px;
      border-radius: 30px;
      min-width: 82px;
      text-align: center;
    }

    .winner-restart-btn {
      margin-top: 22px;
      padding: 16px 42px;
      font-size: clamp(24px, 2.6vw, 44px);
      border-radius: 50px;
      background: var(--yellow);
      color: #1e3c72;
      border: none;
      cursor: pointer;
      font-weight: 900;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .winner-restart-btn:hover {
      transform: scale(1.06);
      background: #ffed4a;
      box-shadow: 0 0 20px #ffd700;
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1999;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 30px;
      top: -100px;
      animation: confettiFall 3s linear infinite;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .overlay-main-text {
      font-size: clamp(58px, 8vw, 134px);
      line-height: 1;
      font-weight: 900;
      color: white;
      text-shadow: 4px 4px 0 #00000030;
      margin-bottom: 22px;
    }

    .countdown-number {
      font-size: clamp(112px, 14vw, 240px);
      line-height: 1;
      font-weight: 900;
      color: var(--yellow);
      text-shadow: 5px 5px 0 #00000050;
      margin: 24px 0;
      min-width: 190px;
      animation: countdownPulse 1s ease;
    }

    @keyframes countdownPulse {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .overlay-subtitle {
      font-size: clamp(32px, 4vw, 76px);
      margin-top: 18px;
      opacity: 0.94;
      color: white;
      font-weight: 900;
    }

    .waiting-message {
      position: fixed;
      left: 50%;
      bottom: clamp(28px, 4vh, 74px);
      transform: translateX(-50%);
      background: white;
      padding: clamp(14px, 1.4vh, 24px) clamp(22px, 2.2vw, 46px);
      border-radius: 60px;
      border: 5px solid #4CAF50;
      font-size: clamp(22px, 2vw, 42px);
      font-weight: 900;
      color: #4CAF50;
      z-index: 1500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.24);
      text-align: center;
      display: none;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
      max-width: 94vw;
    }

    .waiting-message.show {
      display: flex;
      animation: bounce 1s infinite;
    }

    .waiting-message .arrow {
      font-size: clamp(30px, 3vw, 58px);
      animation: pointUp 1s infinite;
    }

    @keyframes pointUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
    }

    /* Distribuci?n adaptable: la barra mide su contenido y el juego ocupa el resto. */
    body {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .arena {
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr));
      grid-auto-rows: minmax(min-content, 1fr);
      height: auto;
      min-height: 0;
      overflow: auto;
      padding: clamp(8px, 1vw, 24px);
      gap: clamp(8px, 1vw, 20px);
      align-items: stretch;
    }
    .zone { height: auto; min-height: 460px; min-width: 0; overflow: visible; container-type: inline-size; }
    .game-container { height: auto; padding: clamp(8px, 2cqw, 24px); }
    .jugador {
      width: 100%;
      height: auto;
      max-width: 1200px;
      margin-inline: auto;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto auto minmax(min-content, 1fr) auto auto auto;
      grid-template-areas: "score name" "expr expr" "apples apples" "vertical vertical" "opts opts" "feedback feedback";
      gap: clamp(6px, 1vh, 16px);

    .score, .nombre {
      font-size: clamp(14px, 4cqw, 30px);
      padding: 6px 8px;

      overflow-wrap: anywhere;
    }
    .expr { font-size: clamp(28px, 9cqw, 84px); line-height: 1; }
    .apples-row {
      width: 100%; max-width: 650px; justify-self: center;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: clamp(4px, 2cqw, 20px);
    }
    .pile {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: auto;
      min-width: 0; min-height: 88px;
      overflow: visible;
      padding: clamp(3px, 1cqw, 10px);
      gap: clamp(2px, 0.6cqw, 6px);
      place-items: center;
      align-content: center;

    .apple-item { font-size: clamp(18px, 6cqw, 48px); line-height: 1.1; }
    .plus { font-size: clamp(24px, 7cqw, 64px); }
    .vertical {
      width: min(100%, 300px); justify-self: center;
      font-size: clamp(26px, 8cqw, 72px);
      padding: 6px; border-width: 3px;
    }
    .vertical .line { width: 65%; margin-top: 4px; border-top-width: 3px; }
    .opciones {
      width: 100%; max-width: 640px; justify-self: center;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(6px, 2cqw, 16px);
    }
    .opcion {
      min-width: 0;
      min-height: clamp(48px, 6vh, 112px);
      font-size: clamp(24px, 7cqw, 64px);
      padding: 6px; border-width: 3px; border-radius: 16px;

    .flag-container { gap: 6px; max-width: 100%; }

    header.bottom-controls {
      grid-row: 2;
      display: flex; flex-wrap: wrap; justify-content: center;
      min-height: 0; height: auto; gap: 6px 10px;
      padding: 8px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      border-top: 3px solid rgba(3,130,198,.14); border-bottom: 0;
      box-shadow: 0 -6px 18px rgba(3,62,100,.12);

    .control-brand { min-width: 0; width: clamp(80px, 8vw, 180px); }
    .control-brand img { max-width: 100%; max-height: 48px; }
    .control-avacom img { height: 48px; max-width: 150px; }

    .action-btn, .language-btn, .music-btn, #fsBtn {
      min-height: 44px; max-width: 100%; padding: 8px 12px;
      font-size: clamp(12px, 1vw, 18px); white-space: normal;
    }

    .player-count-label { font-size: 12px; }
    .player-count-buttons { gap: 4px; }
    .player-count-btn { width: 44px; height: 44px; font-size: 18px; border-width: 2px; }

    /* Dos columnas solo cuando cada jugador dispone de ancho suficiente. */
    @media (min-width: 640px) {
      body.players-2 .arena, body.players-3 .arena, body.players-4 .arena { --columns: 2; }
    }
    @media (min-width: 1080px) { body.players-3 .arena { --columns: 3; } }
    @media (min-width: 1440px) { body.players-4 .arena { --columns: 4; } }
    @media (max-width: 1100px) {
      .control-brand, .control-avacom { display: none; }
    }
    @media (max-width: 760px) {
      header.bottom-controls { gap: 5px; padding-top: 5px; }
      .player-count-label { display: none; }
      .action-btn, .language-btn, .music-btn, #fsBtn { padding: 6px 8px; font-size: 12px; }
    }
    /* Un panel ancho puede colocar representaciones en paralelo. */
    @container (min-width: 560px) {
      .jugador {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: auto auto minmax(min-content, 1fr) auto;
        grid-template-areas: "score expr name" "apples apples vertical" "opts opts opts" "feedback feedback feedback";
      }
      .opciones { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    /* Respuestas al alcance de los niños en pantallas grandes horizontales. */
    @media (min-width: 1440px) and (min-height: 601px) and (orientation: landscape) {
      .game-container { flex: 1; }
      .jugador {
        grid-template-columns: repeat(2, minmax(0, 1fr));

        grid-template-areas: "score name" "expr expr" "apples apples" "vertical vertical" "feedback feedback" "opts opts";
      }
      .opciones {

      }

    }
    @media (max-height: 600px) and (min-width: 640px) {
      .zone { min-height: 330px; }
      .jugador {
        grid-template-columns: repeat(2, minmax(0, 1fr));

      }

      .pile { min-height: 0; padding: 2px; gap: 2px; }
      .apple-item { font-size: clamp(18px, 3cqw, 25px); }

      .opciones { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    }
    .winner-overlay, .start-overlay { padding: 12px; }
    .winner-card {

    .ranking-container { padding: clamp(8px, 2vw, 22px); margin: 10px 0; }
    .ranking-item { padding: 8px; gap: 6px; font-size: clamp(16px, 2.3vw, 32px); }

    .player-name { overflow-wrap: anywhere; }
    .player-score { min-width: 44px; padding: 6px 10px; }
    .medal { font-size: clamp(24px, 3vw, 44px); flex-shrink: 0; }
    .winner-restart-btn { max-width: 100%; font-size: clamp(20px, 3vw, 36px); padding: 12px 20px; margin-top: 12px; }

    /* Se conserva la preferencia existente de ocultar el mensaje de espera. */

  </style>
</head>

  <audio id="soundEnd" src="https://actions.google.com/sounds/v1/cartoon/metal_clang.ogg" preload="auto"></audio>

  <script>
    const TOTAL_TIME = 60;
    const allPlayers = ['p1', 'p2', 'p3', 'p4'];
    let activePlayerCount = 4;
    let players = allPlayers.slice(0, activePlayerCount);
    let timeLeft = TOTAL_TIME;
    let puntos = { p1: 0, p2: 0, p3: 0, p4: 0 };
    let timer = null;
    let gameActive = false;
    let gameStarted = false;
    let audioInitialized = false;
    let musicPlaying = true;
    let currentLanguage = 'es';

    const soundCorrect = document.getElementById('soundCorrect');
    const soundStart = document.getElementById('soundStart');
    const soundEnd = document.getElementById('soundEnd');
    const soundWrong = document.getElementById('soundWrong');
    const backgroundMusic = document.getElementById('backgroundMusic');
    const soundWinnerFanfare = document.getElementById('soundWinnerFanfare');
    const musicBtn = document.getElementById('musicBtn');
    const startGameBtn = document.getElementById('startGameBtn');
    const headerRestartBtn = document.getElementById('headerRestartBtn');
    const waitingMessage = document.getElementById('waitingMessage');
    const startOverlay = document.getElementById('startOverlay');
    const startMainText = document.getElementById('startMainText');
    const countdownNumber = document.getElementById('countdownNumber');
    const startSubText = document.getElementById('startSubText');
    const winnerOverlay = document.getElementById('winnerOverlay');
    const winnerRestartBtn = document.getElementById('winnerRestartBtn');
    const playerCountButtons = Array.from(document.querySelectorAll('.player-count-btn'));

    const translations = {
      es: {
        title: "SUMA2 - PANTALLA HORIZONTAL",
        points: "Puntos: ",
        player: "Jugador ",
        playersLabel: "Jugadores",
        timeLabel: "TIEMPO RESTANTE",
        restart: "Reiniciar Juego",
        start: "Iniciar Juego",
        ready: "¡LISTOS!",
        readySub: "¡SUMEN RÁPIDO!",
        fullscreen: "Pantalla completa",
        exitFullscreen: "Salir pantalla completa",
        language: "ES",
        languageFlag: "https://flagcdn.com/w20/es.png",
        winner: "¡RANKING FINAL!",
        pointsText: "puntos",
        restartOverlay: "🔄 Jugar de Nuevo",
        bien: "BIEN",
        musicOn: "Música ON",
        musicOff: "Música OFF",
        waiting: "Selecciona jugadores y presiona Iniciar Juego",
        podium: "🏆 PODIO 🏆"
      },
      en: {
        title: "SUMA2 - HORIZONTAL SCREEN",
        points: "Points: ",
        player: "Player ",
        playersLabel: "Players",
        timeLabel: "TIME REMAINING",
        restart: "Restart Game",
        start: "Start Game",
        ready: "READY!",
        readySub: "SUM FAST!",
        fullscreen: "Fullscreen",
        exitFullscreen: "Exit fullscreen",
        language: "EN",
        languageFlag: "https://flagcdn.com/w20/us.png",
        winner: "FINAL RANKING!",
        pointsText: "points",
        restartOverlay: "🔄 Play Again",
        bien: "GOOD",
        musicOn: "Music ON",
        musicOff: "Music OFF",
        waiting: "Choose players and press Start Game",
        podium: "🏆 PODIUM 🏆"
      }
    };

    function getLang() {
      return translations[currentLanguage];
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function apples(n) {
      return '🍎'.repeat(n);
    }

    function renderApplePile(container, n) {
      container.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const apple = document.createElement('span');
        apple.className = 'apple-item';
        apple.textContent = '🍎';
        container.appendChild(apple);
      }
    }

    function safePlay(audioEl) {
      if (!audioEl) return;
      try {
        audioEl.currentTime = 0;
        audioEl.play().catch(() => {});
      } catch (error) {}
    }

    function initializeAudio() {
      if (audioInitialized) return;
      backgroundMusic.volume = 0.28;
      backgroundMusic.play()
        .then(() => {
          musicBtn.classList.add('playing');
          audioInitialized = true;
          musicPlaying = true;
          updateMusicButton();
        })
        .catch(() => {
          musicBtn.classList.remove('playing');
          audioInitialized = true;
          musicPlaying = false;
          updateMusicButton();
        });
    }

    function updateMusicButton() {
      const lang = getLang();
      const musicText = musicBtn.querySelector('.music-text');
      const musicIcon = musicBtn.querySelector('.music-icon');
      musicText.textContent = musicPlaying ? lang.musicOn : lang.musicOff;
      musicIcon.textContent = musicPlaying ? '🎵' : '🔇';
      musicBtn.classList.toggle('playing', musicPlaying);
    }

    function toggleMusic() {
      if (musicPlaying) {
        backgroundMusic.pause();
        musicPlaying = false;
        updateMusicButton();
      } else {
        backgroundMusic.play()
          .then(() => {
            musicPlaying = true;
            updateMusicButton();
          })
          .catch(() => {
            musicPlaying = false;
            updateMusicButton();
          });
      }
    }

    function updateTimerDisplay() {
      const timerDisplay = document.getElementById('timerDisplay');
      if (!timerDisplay) return;
      timerDisplay.textContent = timeLeft;
      if (timeLeft <= 10) {
        timerDisplay.style.color = '#d81b60';
        timerDisplay.style.animation = timeLeft <= 5 ? 'pulse 0.5s infinite' : 'none';
      } else {
        timerDisplay.style.color = '#0382c6';
        timerDisplay.style.animation = 'none';
      }
    }

    function setPlayerCount(count, options = {}) {
      activePlayerCount = Math.max(1, Math.min(4, Number(count) || 4));
      players = allPlayers.slice(0, activePlayerCount);
      document.body.classList.remove('players-1', 'players-2', 'players-3', 'players-4');
      document.body.classList.add('players-' + activePlayerCount);

      allPlayers.forEach((pid, index) => {
        const zone = document.getElementById('zone' + (index + 1));
        if (zone) zone.classList.toggle('inactive', index >= activePlayerCount);
      });

      playerCountButtons.forEach(btn => {
        const isActive = Number(btn.dataset.count) === activePlayerCount;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });

      if (!options.keepState) resetToStandby(false);
      updateLanguage();
    }

    function setPlayerButtonsEnabled(enabled) {
      playerCountButtons.forEach(btn => { btn.disabled = !enabled; });
    }

    function clearPlayerInterface(pid) {
      const playerElement = document.getElementById(pid);
      if (!playerElement) return;
      playerElement.querySelector('[data-score]').textContent = getLang().points + '0';
      playerElement.querySelector('[data-opts]').innerHTML = '';
      playerElement.querySelector('[data-a]').textContent = '';
      playerElement.querySelector('[data-b]').textContent = '';
      playerElement.querySelector('[data-vert]').innerHTML = '';
      playerElement.querySelector('[data-expr]').textContent = '';
      const feedback = playerElement.querySelector('[data-feedback]');
      if (feedback) feedback.classList.remove('show');
      playerElement.querySelector('[data-wrong]').classList.remove('show');
    }

    function updateScore(pid) {
      const scoreElement = document.getElementById(pid)?.querySelector('[data-score]');
      if (scoreElement) scoreElement.textContent = getLang().points + puntos[pid];
    }

    function renderProblem(pid) {
      const root = document.getElementById(pid);
      if (!root || !players.includes(pid)) return;

      const a = randInt(1, 9);
      const b = randInt(1, 9);
      const correct = a + b;

      root.querySelector('[data-expr]').textContent = `${a} + ${b}`;
      renderApplePile(root.querySelector('[data-a]'), a);
      renderApplePile(root.querySelector('[data-b]'), b);
      root.querySelector('[data-vert]').innerHTML = `${a}<br><b>+ ${b}</b><span class="line"></span>`;

      const opts = root.querySelector('[data-opts]');
      opts.innerHTML = '';
      const set = new Set([correct]);

      while (set.size < 4) set.add(randInt(2, 18));

      shuffle([...set]).forEach(val => {
        const d = document.createElement('button');
        d.type = 'button';
        d.className = 'opcion';
        d.textContent = val;
        d.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleAnswer(pid, val, correct, d);
        });
        opts.appendChild(d);
      });
    }

    function showFlag(pid) {
      const root = document.getElementById(pid);
      if (!root) return;
      const feedback = root.querySelector('[data-feedback]');
      const wrong = root.querySelector('[data-wrong]');
      wrong.classList.remove('show');
      feedback.classList.add('show');
      window.setTimeout(() => feedback.classList.remove('show'), 900);
    }

    function showWrongFlag(pid) {
      const root = document.getElementById(pid);
      if (!root) return;
      const feedback = root.querySelector('[data-feedback]');
      const wrong = root.querySelector('[data-wrong]');
      feedback.classList.remove('show');
      wrong.classList.add('show');
      window.setTimeout(() => wrong.classList.remove('show'), 850);
    }

    function handleAnswer(pid, chosen, correct, btn) {
      if (!gameActive || !gameStarted || !players.includes(pid)) return;
      if (btn.classList.contains('disabled')) return;

      if (chosen === correct) {
        puntos[pid] += 1;
        updateScore(pid);
        showFlag(pid);
        safePlay(soundCorrect);
        btn.classList.add('disabled');
        btn.style.background = '#4CAF50';
        btn.style.color = 'white';
        btn.style.borderColor = '#4CAF50';
        window.setTimeout(() => renderProblem(pid), 260);
      } else {
        showWrongFlag(pid);
        safePlay(soundWrong);
        btn.classList.add('wrong');
        window.setTimeout(() => btn.classList.remove('wrong'), 300);
      }
    }

    function createConfetti() {
      const confettiContainer = document.getElementById('confetti');
      confettiContainer.innerHTML = '';
      const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffcc5c'];
      for (let i = 0; i < 150; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.animationDelay = Math.random() * 3 + 's';
        piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (Math.random() * 10 + 5) + 'px';
        piece.style.height = (Math.random() * 20 + 10) + 'px';
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        confettiContainer.appendChild(piece);
      }
    }

    function generateRanking() {
      const rankingList = document.getElementById('rankingList');
      rankingList.innerHTML = '';
      const lang = getLang();

      const jugadores = players.map((pid, index) => ({
        id: pid,
        nombre: lang.player + (index + 1),
        puntos: puntos[pid]
      })).sort((a, b) => b.puntos - a.puntos);

      jugadores.forEach((jugador, index) => {
        const item = document.createElement('div');
        item.className = 'ranking-item';
        if (index === 0) item.classList.add('first');
        else if (index === 1) item.classList.add('second');
        else if (index === 2) item.classList.add('third');

        const medalla = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '⭐';
        item.innerHTML = `
          <div class="player-info">
            <span class="medal">${medalla}</span>
            <span class="player-name">${jugador.nombre}</span>
          </div>
          <span class="player-score">${jugador.puntos}</span>
        `;
        rankingList.appendChild(item);
      });
    }

    function showWinnerOverlay() {
      const lang = getLang();
      document.getElementById('winnerTitle').textContent = lang.winner;
      document.getElementById('rankingTitle').textContent = lang.podium;
      winnerRestartBtn.textContent = lang.restartOverlay;
      generateRanking();
      createConfetti();
      safePlay(soundWinnerFanfare);
      winnerOverlay.classList.add('show');
    }

    function showStartOverlayAndStartGame() {
      if (gameStarted) return;
      initializeAudio();
      waitingMessage.classList.remove('show');
      startOverlay.classList.add('show');
      safePlay(soundStart);
      startGameBtn.disabled = true;
      headerRestartBtn.disabled = true;
      setPlayerButtonsEnabled(false);

      let count = 3;
      countdownNumber.textContent = count;
      countdownNumber.style.display = 'block';

      const countdownInterval = window.setInterval(() => {
        count--;
        if (count >= 1) {
          countdownNumber.textContent = count;
          countdownNumber.style.animation = 'none';
          void countdownNumber.offsetWidth;
          countdownNumber.style.animation = 'countdownPulse 0.5s ease';
        } else {
          window.clearInterval(countdownInterval);
          countdownNumber.textContent = currentLanguage === 'es' ? '¡YA!' : 'GO!';
          countdownNumber.style.animation = 'none';
          void countdownNumber.offsetWidth;
          countdownNumber.style.animation = 'countdownPulse 0.5s ease';
          window.setTimeout(() => {
            startOverlay.classList.remove('show');
            countdownNumber.textContent = '3';
            actuallyStartGame();
          }, 700);
        }
      }, 1000);
    }

    function actuallyStartGame() {
      gameStarted = true;
      gameActive = true;
      headerRestartBtn.disabled = false;
      startGameBtn.disabled = true;
      setPlayerButtonsEnabled(false);

      allPlayers.forEach(pid => clearPlayerInterface(pid));
      players.forEach(pid => {
        renderProblem(pid);
        updateScore(pid);
      });

      timeLeft = TOTAL_TIME;
      updateTimerDisplay();
      if (timer) window.clearInterval(timer);

      timer = window.setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          window.clearInterval(timer);
          timer = null;
          finishGame();
        }
      }, 1000);
    }

    function finishGame() {
      gameActive = false;
      gameStarted = false;
      setPlayerButtonsEnabled(true);
      safePlay(soundEnd);
      showWinnerOverlay();

      const lang = getLang();
      const timerDisplay = document.getElementById('timerDisplay');
      const valores = players.map(p => puntos[p]);
      const maxVal = Math.max(...valores);
      const winners = players.filter(p => puntos[p] === maxVal);

      if (timerDisplay) {
        if (maxVal === 0) {
          timerDisplay.textContent = '0 ' + lang.pointsText;
        } else if (winners.length === 1) {
          const winnerIndex = players.indexOf(winners[0]) + 1;
          timerDisplay.textContent = `${lang.player}${winnerIndex} (${maxVal} ${lang.pointsText})`;
        } else {
          const winnerNames = winners.map(w => players.indexOf(w) + 1).join(' & ');
          timerDisplay.textContent = `${winnerNames} (${maxVal} ${lang.pointsText})`;
        }
      }
    }

    function resetToStandby(showWinner = true) {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }

      if (showWinner) winnerOverlay.classList.remove('show');
      gameActive = false;
      gameStarted = false;
      puntos = { p1: 0, p2: 0, p3: 0, p4: 0 };
      timeLeft = TOTAL_TIME;
      updateTimerDisplay();

      allPlayers.forEach(pid => clearPlayerInterface(pid));
      headerRestartBtn.disabled = true;
      startGameBtn.disabled = false;
      setPlayerButtonsEnabled(true);
      waitingMessage.classList.add('show');
      countdownNumber.textContent = '3';
      updateLanguage();
    }

    function updateLanguage() {
      const lang = getLang();

      document.title = lang.title;
      document.querySelector('.timer-label').textContent = lang.timeLabel;
      document.getElementById('playerCountLabel').textContent = lang.playersLabel;
      document.getElementById('fsBtn').textContent = document.fullscreenElement ? lang.exitFullscreen : lang.fullscreen;
      document.getElementById('headerRestartBtn').innerHTML = '🔄 ' + lang.restart;
      document.getElementById('startGameBtn').innerHTML = '▶ ' + lang.start;
      document.getElementById('waitingText').textContent = lang.waiting;
      startMainText.textContent = lang.ready;
      startSubText.textContent = lang.readySub;
      document.getElementById('winnerTitle').textContent = lang.winner;
      document.getElementById('rankingTitle').textContent = lang.podium;
      winnerRestartBtn.textContent = lang.restartOverlay;
      updateMusicButton();

      const languageBtn = document.getElementById('languageBtn');
      languageBtn.innerHTML = '';
      const selectorSpan = document.createElement('span');
      selectorSpan.className = 'language-selector';
      const flagImg = document.createElement('img');
      flagImg.src = lang.languageFlag;
      flagImg.alt = currentLanguage.toUpperCase();
      flagImg.className = 'language-flag';
      const textSpan = document.createElement('span');
      textSpan.textContent = lang.language;
      selectorSpan.appendChild(flagImg);
      selectorSpan.appendChild(textSpan);
      languageBtn.appendChild(selectorSpan);

      allPlayers.forEach((pid, index) => {
        const playerElement = document.getElementById(pid);
        if (!playerElement) return;
        const nombreElement = playerElement.querySelector('.nombre');
        nombreElement.textContent = lang.player + (index + 1);
        const flagText = playerElement.querySelector('[data-flag-text]');
        flagText.textContent = lang.bien;
        updateScore(pid);
      });
    }

    function setupEventListeners() {
      document.getElementById('fsBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        document.getElementById('fsBtn').textContent = document.fullscreenElement ? getLang().exitFullscreen : getLang().fullscreen;
      });

      startGameBtn.addEventListener('click', showStartOverlayAndStartGame);
      headerRestartBtn.addEventListener('click', () => resetToStandby(true));
      winnerRestartBtn.addEventListener('click', () => resetToStandby(true));

      document.getElementById('languageBtn').addEventListener('click', () => {
        currentLanguage = currentLanguage === 'es' ? 'en' : 'es';
        updateLanguage();
      });

      musicBtn.addEventListener('click', toggleMusic);

      playerCountButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          setPlayerCount(Number(btn.dataset.count));
        });
      });

      document.addEventListener('click', function initAudioOnFirstClick() {
        initializeAudio();
        document.removeEventListener('click', initAudioOnFirstClick);
      }, { once: true });

      document.addEventListener('touchstart', function initAudioOnFirstTouch() {
        initializeAudio();
        document.removeEventListener('touchstart', initAudioOnFirstTouch);
      }, { once: true, passive: true });
    }

    function initializeGame() {
      setupEventListeners();
      setPlayerCount(4, { keepState: true });
      resetToStandby(false);
      backgroundMusic.load();
      soundWinnerFanfare.load();
    }

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('load', initializeGame);
    if (document.readyState === 'complete') initializeGame();
  </script>
</body>
</html>
